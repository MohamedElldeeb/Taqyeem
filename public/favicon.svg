<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Emerald Gradient -->
    <linearGradient id="taqyeem-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="taqyeem-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Golden Star Gradient -->
    <linearGradient id="taqyeem-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for crisp icon pop -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Container with Rounded Outer Corner Curve -->
  <rect width="64" height="64" rx="16" fill="url(#taqyeem-brand-grad)" />
  <rect width="64" height="64" rx="16" fill="url(#taqyeem-gloss)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Quotation Symbol with Verified Trust Sparkle Shape -->
  <g filter="url(#icon-shadow)">
    <!-- Primary Left Quotation Wing -->
    <path
      d="M24 18 C28.4 18 32 21.6 32 26 C32 28.5 30.8 30.7 28.9 32.2 C27.5 35.8 24.2 39.6 16.5 43.5 C19.5 39.5 20.4 36.3 19.8 33.6 C16.9 32.9 16 30 16 26 C16 21.6 19.6 18 24 18 Z"
      fill="#FFFFFF"
    />

    <!-- Secondary Right Quotation Wing -->
    <path
      d="M43 18 C47.4 18 51 21.6 51 26 C51 28.5 49.8 30.7 47.9 32.2 C46.5 35.8 43.2 39.6 35.5 43.5 C38.5 39.5 39.4 36.3 38.8 33.6 C35.9 32.9 35 30 35 26 C35 21.6 38.6 18 43 18 Z"
      fill="#FFFFFF"
      fill-opacity="0.88"
    />

    <!-- Golden 5-Point Trust Star Badge (Top-Right Micro Accent) -->
    <path
      d="M47 11.5 L48.3 14.2 L51.2 14.6 L49.1 16.6 L49.6 19.5 L47 18.1 L44.4 19.5 L44.9 16.6 L42.8 14.6 L45.7 14.2 Z"
      fill="url(#taqyeem-star-grad)"
    />
  </g>
</svg>